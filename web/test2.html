<!doctype html>
<html><head><meta charset="utf-8"><title>Online test (several players)</title>
<style>html,body{margin:0;height:100%;background:#000}body{display:flex;flex-wrap:wrap}iframe{flex:1 1 45%;min-height:50%;border:0;outline:1px solid #333}</style></head>
<body><script>
// test page: ?n=3 opens 3 players side by side (each frame is a separate game instance)
const names = ['Ana', 'Bruno', 'Carla', 'Davi'];
if (new URLSearchParams(location.search).has('fresh')) sessionStorage.clear();
const n = Math.min(4, Number(new URLSearchParams(location.search).get('n')) || 2);
for (let i = 0; i < n; i++) { const f = document.createElement('iframe'); f.id = 'abcd'[i]; f.src = 'index.html?name=' + names[i] + (Date.now() % 1000); document.body.append(f); }
</script></body></html>
