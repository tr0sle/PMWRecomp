; Default controls for the web port (this copy of the game shipped without Win32.ini).
; Key names are DirectInput names (UP, LEFT, SPACE, LCONTROL, ...); joystick inputs are
; button numbers, "X Axis -", "POV0 Up", etc. An action may be bound several times.

[ButtonMap KEYBOARD1]
Accelerate = UP
Reverse = DOWN
Turn Left = LEFT
Turn Right = RIGHT
Fire Weapon = SPACE
Throw Weapon = LCONTROL
Hop/Powerslide = LSHIFT
Drop Weapon = X
Guardian = Z
Power Pellet = C
Combo = V
Looker Back = B
Pause = ESCAPE
Pause = P
Interface Up = UP
Interface Down = DOWN
Interface Left = LEFT
Interface Right = RIGHT
Interface Accept = RETURN
Interface Accept = NUMPADENTER
Interface Back = ESCAPE
Interface Back = BACK
Interface Select = RETURN
Interface Pause Accept = RETURN
Interface Pause Exit = ESCAPE
Interface Network Join = J
Interface Network Create = N
Interface Network Refresh = R

[ButtonMap KEYBOARD2]
Accelerate = W
Reverse = S
Turn Left = A
Turn Right = D
Fire Weapon = Q
Throw Weapon = E
Hop/Powerslide = TAB
Drop Weapon = F
Guardian = G
Power Pellet = H
Combo = T
Looker Back = Y
Pause = 1
Interface Up = W
Interface Down = S
Interface Left = A
Interface Right = D
Interface Accept = Q
Interface Back = E
Interface Select = Q
Interface Pause Accept = Q
Interface Pause Exit = E

[ButtonMap JOYSTICK1]
Accelerate = 0
Reverse = 2
Turn Left = X Axis -
Turn Left = POV0 Left
Turn Right = X Axis +
Turn Right = POV0 Right
Fire Weapon = 1
Throw Weapon = 3
Hop/Powerslide = 5
Hop/Powerslide = Z Axis -
Drop Weapon = 4
Guardian = Z Axis +
Power Pellet = 9
Combo = 8
Looker Back = 6
Pause = 7
Interface Up = Y Axis -
Interface Up = POV0 Up
Interface Down = Y Axis +
Interface Down = POV0 Down
Interface Left = X Axis -
Interface Left = POV0 Left
Interface Right = X Axis +
Interface Right = POV0 Right
Interface Accept = 0
Interface Back = 1
Interface Select = 0
Interface Pause Accept = 0
Interface Pause Exit = 1

[ButtonMap JOYSTICK2]
Accelerate = 0
Reverse = 2
Turn Left = X Axis -
Turn Left = POV0 Left
Turn Right = X Axis +
Turn Right = POV0 Right
Fire Weapon = 1
Throw Weapon = 3
Hop/Powerslide = 5
Hop/Powerslide = Z Axis -
Drop Weapon = 4
Guardian = Z Axis +
Power Pellet = 9
Combo = 8
Looker Back = 6
Pause = 7
Interface Up = Y Axis -
Interface Up = POV0 Up
Interface Down = Y Axis +
Interface Down = POV0 Down
Interface Left = X Axis -
Interface Left = POV0 Left
Interface Right = X Axis +
Interface Right = POV0 Right
Interface Accept = 0
Interface Back = 1
Interface Select = 0
Interface Pause Accept = 0
